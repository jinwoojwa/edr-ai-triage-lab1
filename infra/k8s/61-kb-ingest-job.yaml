apiVersion: batch/v1
kind: Job
metadata:
  name: kb-ingest
  namespace: soc
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: wait-opensearch
          image: ghcr.io/leedongwon9812/edr-ai-triage-lab1:day2-stage1-8aab319
          command:
            - python
            - -c
            - |
              import json, time, urllib.request
              url = 'http://opensearch.soc.svc.cluster.local:9200/_cluster/health?wait_for_status=yellow&timeout=5s'
              while True:
                  try:
                      with urllib.request.urlopen(url, timeout=10) as r:
                          health = json.load(r)
                      if not health.get('timed_out', True) and health['status'] in ('yellow', 'green'):
                          print('OpenSearch ready', flush=True)
                          break
                  except Exception as e:
                      print(type(e).__name__, flush=True)
                  time.sleep(5)
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
      containers:
        - name: kb-ingest
          image: ghcr.io/leedongwon9812/edr-ai-triage-lab1-kb:day3-stage6-20261119-ocr
          command: [python, -m, soc.kb.ingest]
          envFrom:
            - configMapRef: {name: soc-app-config}
          env:
            - {name: BACKEND, value: real}
            - {name: FAKE_LLM, value: 'false'}
            - {name: KB_PDF_DIR, value: /app/data/kb/pdf}
            # ingest recreates this index. Choose a new candidate for each new run.
            - {name: INDEX_KB, value: kb-playbooks-d3-candidate-20261119}
            - {name: EMBED_MODEL, value: text-embedding-3-small}
            - {name: EMBED_DIM, value: '1536'}
            - {name: PARSE_STRATEGY, value: fast}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: {name: soc-app-secrets, key: OPENAI_API_KEY}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: '2', memory: 4Gi}
