apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-health
  namespace: soc
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: soc.1.201.110.16.nip.io
      http:
        paths:
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 80
